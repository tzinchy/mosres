server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API is not exposed publicly — the browser talks to it through this proxy,
    # so the frontend uses a relative base URL (/api) and there is no CORS or
    # "localhost" problem on a remote server.
    location /api/ {
        proxy_pass http://api:5433/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # PWA bits: correct manifest type, and never cache the service worker.
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /sw.js { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
