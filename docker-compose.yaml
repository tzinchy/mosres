services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mosres
      POSTGRES_PASSWORD: mosres
      POSTGRES_DB: mosres
    # 5434 on the host: 5432 is already taken by another project's postgres.
    # Host tools (alembic) use this port; the api container talks to db:5432.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # api waits for this before running `alembic upgrade head` on start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosres -d mosres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: dockerfile
    # Not published publicly — `web` reaches it in-network as http://api:5433.
    # Bound to loopback on the host for /docs and debugging.
    ports:
      - "127.0.0.1:5433:5433"
    # Settings (SECRET_KEY, DEFAULT_USER/DEFAULT_PASSWORD, SCHEDULER_ENABLED,
    # REFRESH_INTERVAL_MINUTES) come from .env. DB from .env is ignored here —
    # see the override below. To use a database on the host machine instead of
    # the `db` service, drop the override and set in .env:
    #   DB=postgresql+asyncpg://postgres:password@host.docker.internal:5432/postgres
    env_file:
      - .env
    # Overrides DB from .env: inside the compose network the database is db:5432.
    environment:
      DB: postgresql+asyncpg://mosres:mosres@db:5432/mosres
    # The api container runs `alembic upgrade head` at start, so it must not
    # boot before postgres accepts connections.
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # relative by default; nginx in the web image proxies /api/ -> api:5433
        VITE_API_URL: ${VITE_API_URL:-/api}
    # host port is WEB_PORT from .env (default 8080); container always listens on 80
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
