services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "5433:5433"
    # DB connection lives outside compose. Set DB (and optionally SCHEDULER_ENABLED,
    # REFRESH_HOUR) in .env. For a database running on the host machine, use
    # host.docker.internal as the host, e.g.
    #   DB=postgresql+asyncpg://postgres:password@host.docker.internal:5432/postgres
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5433}
    ports:
      - "5144:5144"
    depends_on:
      - api
